[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsi-harness"
version = "0.1.0"
description = "Harbor GPU task run engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "harbor==0.21.0",
  "docker>=7.1,<8",
  "fastapi>=0.128,<1",
  "huggingface-hub>=0.20",
  "jinja2",
  "pydantic>=2.11.7,<3",
  "python-multipart",
  "pyyaml>=6.0.2,<7",
  "requests",
  "rich",
  "tqdm",
  "typer>=0.25,<1",
  "typing-extensions>=4.0",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
# The E2B env backend ([environments.host] backend = "e2b"): exact pin, the
# broker calls an SDK-internal envd RPC (runtime/sandbox_e2b.py). The SDK
# speaks SOCKS itself; the registry probe's httpx needs the socks extra.
# dockerfile-parse reads image_build's Dockerfiles (sandbox_e2b_dockerfile).
e2b = ["e2b==2.52.0", "dockerfile-parse>=2.0.1,<3", "httpx[socks]"]
# The Modal env backend (backend = "modal"): exact pin, the broker hooks the
# SDK's proxy lookup (runtime/sandbox_modal.py); api-proxy-support carries
# its HTTP CONNECT and SOCKS clients. The rest as for e2b.
modal = [
  "modal[api-proxy-support]==1.6.3",
  "dockerfile-parse>=2.0.1,<3",
  "httpx[socks]",
]
# The Daytona env backend (backend = "daytona"): exact pin, the broker hands
# the SDK's shared session its proxy (runtime/sandbox_daytona.py). The SDK
# brings the registry probe's httpx; no Dockerfile builds, so no
# dockerfile-parse.
daytona = ["daytona==0.227.0"]

[project.scripts]
rsi-sandbox = "rsi_harness.integrations.sandbox_client:main"
rsi-harness = "rsi_harness.cli:app"

[dependency-groups]
test = [
  # sandbox_e2b_dockerfile's tests (the e2b extra's parser).
  "dockerfile-parse>=2.0.1,<3",
  "httpx",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_harness", "src/rsi_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "runtime: tests for runtime contracts",
  "gpu: tests that need GPU support",
  "integration: integration tests",
  "acceptance: operator acceptance and root checks (opt-in: RSI_ACCEPTANCE=1)",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
  # Archived run evidence is data, not source to rewrite with a formatter.
  "logs",
  "src/rsi_loop",
  # Verbatim Terminal-Bench 2 tasks shipped by the harbor-in-judge sample.
  "sample_tasks/harbor-in-judge/tests/tb2-subset",
  "sample_tasks/harbor-in-judge/tests/fix-git-build",
  # The science-ising3d starter, ported unchanged; the Agent may replace it.
  "sample_tasks/science-ising3d/environment/starter",
  # The public science Judge library, a byte-for-byte copy of OpenRSI-X's
  # science-task-agent assets/science_judge.py.
  "sample_tasks/science-ising3d/tests/science_judge.py",
]

[tool.ruff.per-file-target-version]
# rsi-agent and rsi-isolate run under the Judge image's own python3 (3.8 or
# later).
"src/rsi_harness/judge_agent/rsi_agent.py" = "py38"
"src/rsi_harness/judge_agent/rsi_isolate.py" = "py38"
"src/rsi_harness/judge_agent/judge_isolation.py" = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

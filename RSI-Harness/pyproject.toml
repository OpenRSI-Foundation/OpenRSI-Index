[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsi-harness"
version = "0.1.0"
description = "Harbor GPU task run engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "harbor==0.21.0",
  "docker>=7.1,<8",
  "fastapi>=0.128,<1",
  "huggingface-hub>=0.20",
  "jinja2",
  "pydantic>=2.11.7,<3",
  "python-multipart",
  "pyyaml>=6.0.2,<7",
  "requests",
  "rich",
  "tqdm",
  "typer>=0.25,<1",
  "typing-extensions>=4.0",
  "uvicorn[standard]>=0.38,<1",
]

[project.scripts]
rsi-harness = "rsi_harness.cli:app"

[dependency-groups]
test = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_harness", "src/rsi_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "runtime: tests for runtime contracts",
  "gpu: tests that need GPU support",
  "integration: integration tests",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/rsi_loop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

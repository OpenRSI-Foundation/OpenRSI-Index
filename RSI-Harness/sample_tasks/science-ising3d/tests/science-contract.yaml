# New public-review runtime contract; the original A7 contract remains unchanged.
schema_version: rsi-science-contract/0.5-draft
task_id: science-ising3d
status: design_draft
launch_ready: false   # true only after execution validation passes and launch_blockers is empty

target:
  objective_type: claim
  statement: Derive a unified, error-controlled thermodynamic construction and its transition location and leading critical laws on both sides.
  domain_specification: >-
    Spins +/-1, uniform nearest-neighbor ferromagnetic J>0, zero field, simple-cubic lattice;
    H=-J sum_<ij> s_i*s_j with each undirected bond counted once. K=J/(k_B*T).
    Periodic finite cubes tend to infinite volume; p(K)=lim_N log(Z_N(K))/N.
    Energy/J=-dp/dK and heat capacity/k_B=K^2*d2p/dK2. Cover all finite K>=0,
    high/low-temperature asymptotics and leading pressure singularities on both critical sides.
    Nonzero fields, other lattices, disorder, frustration, all spatial correlations and a full
    conformal spectrum are outside scope. Ordinary checkable derivations, independent consequences
    and justified error control suffice; a complete formalized exact proof is not required.
  allowed_premises:
    - {id: P1, statement: The stated spin model and equilibrium periodic-volume thermodynamic limit.}
    - {id: P2, statement: Standard mathematical identities with their applicability conditions stated.}
  claims:
    - {id: C01, statement: "Construction corresponds to the specified finite lattice model"}
    - {id: C02, statement: "Supported derivation of the unified thermodynamic construction"}
    - {id: C03, statement: "Controlled thermodynamic-limit construction"}
    - {id: C04, statement: "Pressure throughout the ordinary high-temperature phase"}
    - {id: C05, statement: "Pressure throughout the ordinary low-temperature phase"}
    - {id: C06, statement: "Energy throughout the ordinary high-temperature phase"}
    - {id: C07, statement: "Energy throughout the ordinary low-temperature phase"}
    - {id: C08, statement: "Heat capacity throughout the ordinary high-temperature phase"}
    - {id: C09, statement: "Heat capacity throughout the ordinary low-temperature phase"}
    - {id: C10, statement: "Controlled high-temperature pressure asymptotics"}
    - {id: C11, statement: "Controlled low-temperature pressure asymptotics"}
    - {id: C12, statement: "Controlled high-temperature energy asymptotics"}
    - {id: C13, statement: "Controlled low-temperature energy asymptotics"}
    - {id: C14, statement: "Controlled high-temperature heat-capacity asymptotics"}
    - {id: C15, statement: "Controlled low-temperature heat-capacity asymptotics"}
    - {id: C16, statement: "Critical coupling derived from the same construction"}
    - {id: C17, statement: "Critical pressure value and consistent regular background"}
    - {id: C18, statement: "Critical energy value and matching one-sided limits"}
    - {id: C19, statement: "Leading singular pressure law from the high-temperature side"}
    - {id: C20, statement: "Leading singular pressure law from the low-temperature side"}
    - {id: C21, statement: "Leading critical energy law from the high-temperature side"}
    - {id: C22, statement: "Leading critical energy law from the low-temperature side"}
    - {id: C23, statement: "Leading critical heat-capacity law from the high-temperature side"}
    - {id: C24, statement: "Leading critical heat-capacity law from the low-temperature side"}
    - {id: C25, statement: "All branches and scientific outputs belong to one coherent construction"}
    - {id: C26, statement: "Independent reproduction of decisive scientific results"}

research_contract:
  starting_point:
    mode: provided_artifacts
    assets: [/opt/science/starter (an explicitly insufficient example, also the initial /workspace/candidate)]
  action_space:
    allowed: >-
      Develop and revise hypotheses, derivations, representations, controlled approximations,
      code and evidence; use public research and budgeted local calculations. Cite imported results.
      No prescribed theory family or formal-proof language; no per-iteration human involvement.
    immutable: [task_contract, task_owned_assets, public_rubrics, reviewer_protocol]
  submission:
    artifacts: [theory.md, supporting derivations/code/data/references and reproduction instructions]
    interface: >-
      Files under /workspace/candidate, at most 512 regular files and 32 MiB, no symlinks; theory.md is
      the main argument. rsi-submit freezes the candidate; candidate_digest is SHA256 of the canonical JSON
      file-hash mapping and rubric_digest is SHA256 of the exact rubrics.json bytes. model.py:pressure(K)
      (finite floating-point pressure values) and probe.py (a bounded deterministic reproduction that prints
      its own results) are optional recompute routes; each runs offline on its own copy, as its own
      unprivileged user, in the Judge started from the clean task image, with a 60-second limit. The
      integrity.md and integrity.schema.json audit applies first to every submission and the
      Harness-captured trajectory up to it; only clear permits a valid scientific review/count.

verification_contract:
  owner: task_author
  implementation_status: model_review_only
  adequacy: >-
    A separate automatic integrity audit first establishes submission validity; only a clear audit
    permits scientific scoring. Automatic model scientific peer review then applies the 26 public scientific criteria using ordinary
    mathematical reasoning, code inspection, cited evidence and task-controlled recompute diagnostics.
    No universal formal checker is claimed. Integrity availability, unfinished audit and audit errors
    never become valid zero scores or scientific failures; integrity is not a scored science criterion. Finite probes do not establish whole-rubric passes.
    Essential unsupported arguments remain unresolved; demonstrated contradictions fail. Subtle
    reasoning may be misjudged; review reliability must be documented, not assumed formally sound.
    This revision implements the public-review method; execution traces and calibration limits are recorded separately.
  visibility: {specification: full, verifier_code: full, test_instances: full, reference_answers_and_evidence: full, feedback: full}
  evidence_policy:
    validity: >-
      Before scientific judgment, automatically audit the same frozen candidate and the complete Harness-captured
      trajectory up to the submission under public integrity.md and integrity.schema.json. Only clear permits a valid count
      or completion. Proven tampering, forged task-controlled evidence or judge-directed prompt injection
      invalidate the submission; violation, unresolved or missing/failed audit yields no valid reward.
      Scientific proof gaps or transparent borrowed inputs are not by themselves malicious; unsupported or
      circular derivation is judged in the affected scientific criteria. No later acceptance gate or integrity point.
    quality: >-
      Trace evidence versions, applicability, uncertainty, assumptions and independence. References
      are not automatically ground truth. Resolve material conflicts within the affected rubric.
      Widening uncertainty or presenting candidate success logs does not establish a claim.
      Phase-wide results need supported quantitative refinement; endpoint and critical claims need
      asymptotically discriminating errors. Accuracy of pressure does not imply accuracy of derivatives.
      Independent support may be mathematical or computational and does not require unseen data.
    information_boundary: >-
      Public references and answers may be read; borrowed Kc/exponents cannot validate their own
      purported independent derivation. Each revision creates a new candidate. No mandatory holdout.
    acquisition: >-
      The Judge reads the frozen candidate, including the sources it cites and includes, and runs its own
      offline recompute of the optional routes (bundle.json); reviewers add their own reasoning and small
      independent calculations and do not search the web. Essential unavailable evidence remains
      unresolved. No human measurements or approvals in the loop.
  requirements:
    - {id: R01, claim_supported: [C01], evidence_required: ["Construction corresponds to the specified finite lattice model"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R01.pass_when}
    - {id: R02, claim_supported: [C02], evidence_required: ["Supported derivation of the unified thermodynamic construction"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R02.pass_when}
    - {id: R03, claim_supported: [C03], evidence_required: ["Controlled thermodynamic-limit construction"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R03.pass_when}
    - {id: R04, claim_supported: [C04], evidence_required: ["Pressure throughout the ordinary high-temperature phase"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R04.pass_when}
    - {id: R05, claim_supported: [C05], evidence_required: ["Pressure throughout the ordinary low-temperature phase"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R05.pass_when}
    - {id: R06, claim_supported: [C06], evidence_required: ["Energy throughout the ordinary high-temperature phase"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R06.pass_when}
    - {id: R07, claim_supported: [C07], evidence_required: ["Energy throughout the ordinary low-temperature phase"], method: public reviewer.md after clear integrity audit, pass_rule: rubrics.json R07.pass_when}

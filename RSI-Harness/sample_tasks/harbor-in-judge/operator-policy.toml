# Operator policy (--sandbox-policy) for sample_tasks/harbor-in-judge: the
# one-time grant of brokered environments to its Work and every Judge round.
# Review and sign it before use (docs/sandbox-operator-guide.md, "Operator steps"):
# - builder_image is moby/buildkit:v0.27.1 by digest; pre-pull it and check
#   `docker image inspect --format '{{index .RepoDigests 0}}' moby/buildkit:v0.27.1`;
# - granting builds accepts the builder exception (CAP_SYS_ADMIN/NET_ADMIN,
#   no seccomp/AppArmor profile of its own, never a host path or device);
# - granting public children to a no-network Work or Judge lets it reach
#   the internet indirectly (RFC1918, metadata and the host stay blocked).
# Reservation: 28 CPUs, 51456 MiB, 65536 MiB of (soft) disk.
pool_cpus = 32
pool_memory_mb = 65536

[environments.host]
pool_disk_mb = 65536
disk_floor_mb = 10240
disk_hard_floor_mb = 4096
request_slots_active = 8
request_slots_queued = 32
waiters = 64
no_new_privileges = true

[environments.work]
network = ["public", "none"]
pull = true
registries = ["docker.io", "public.ecr.aws"]
max_envs_live = 4
max_envs_created = 400
max_services_per_env = 8
max_containers_live = 8
max_cpus_live = 8
max_memory_mb_live = 12288
max_disk_mb_live = 24576
cpus_per_container = 4
memory_mb_per_container = 8192
# Swap per service as a fraction of its memory (1: as much as memory, like
# Docker and stock Harbor; 0: none).
swap_ratio = 1.0
pids_per_container = 8192
disk_mb_per_container = 10240
max_env_lifetime_sec = 14400
max_wait_timeout_sec = 900
max_execs_running = 64
max_exec_output_bytes = 16777216
max_jobs_running = 4
max_pull_mb = 20480
max_log_bytes = 2147483648
max_upload_bytes = 17179869184
max_download_bytes = 17179869184
max_operations = 1000000

# Granting builds accepts the documented builder exception (docs/sandbox-operator-guide.md).
[environments.work.build]
builder_image = "moby/buildkit@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368"
network = ["public", "none"]
cpus = 4
memory_mb = 8192
pids = 4096
disk_mb = 4096
state_fs = "loop-ext4"
max_builds = 64
max_concurrent_builds = 1
max_build_sec = 3600
max_context_mb = 1024
max_image_mb = 4096
max_images_total_mb = 4096
syntax_frontends = ["docker.io/docker/dockerfile"]

[environments.judge]
network = ["public", "none"]
pull = true
registries = ["docker.io", "public.ecr.aws"]
max_envs_live = 4
max_envs_created = 400
max_services_per_env = 8
max_containers_live = 8
max_cpus_live = 8
max_memory_mb_live = 12288
max_disk_mb_live = 24576
cpus_per_container = 4
memory_mb_per_container = 8192
# Swap per service as a fraction of its memory (1: as much as memory, like
# Docker and stock Harbor; 0: none).
swap_ratio = 1.0
pids_per_container = 8192
disk_mb_per_container = 10240
max_env_lifetime_sec = 14400
max_wait_timeout_sec = 900
max_execs_running = 64
max_exec_output_bytes = 16777216
max_jobs_running = 4
max_pull_mb = 20480
max_log_bytes = 2147483648
max_upload_bytes = 17179869184
max_download_bytes = 17179869184
max_operations = 1000000

# Granting builds accepts the documented builder exception (docs/sandbox-operator-guide.md).
[environments.judge.build]
builder_image = "moby/buildkit@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368"
network = ["public", "none"]
cpus = 4
memory_mb = 8192
pids = 4096
disk_mb = 4096
state_fs = "loop-ext4"
max_builds = 64
max_concurrent_builds = 1
max_build_sec = 3600
max_context_mb = 1024
max_image_mb = 4096
max_images_total_mb = 4096
syntax_frontends = ["docker.io/docker/dockerfile"]

[environments.run_limits]
max_envs_created = 1000
max_operations = 2000000
max_builds = 256
max_pull_mb = 40960
max_upload_bytes = 34359738368
max_download_bytes = 34359738368
max_log_bytes = 4294967296

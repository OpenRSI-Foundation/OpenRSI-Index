schema_version = "1.4"

[task]
name = "rsi/harbor-compose-sidecar"

[environment]
docker_image = "python:3.13-slim-bookworm"
os = "linux"
cpus = 1
memory_mb = 512
network_mode = "no-network"

[agent]
timeout_sec = 120
network_mode = "no-network"

[verifier]
timeout_sec = 120
network_mode = "no-network"

schema_version = "1.4"

[task]
name = "rsi/hello-file"

# A trivially easy task for a small model. The environment is a cached image
# with public egress: terminus-2 installs tmux into it when its trial starts.
[environment]
docker_image = "python:3.13-slim-bookworm"
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 120

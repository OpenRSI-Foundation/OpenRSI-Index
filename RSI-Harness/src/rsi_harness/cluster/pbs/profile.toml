# Portable example. Copy outside the repository and configure shared storage,
# installed tools, queue/account, data binds, and node resources for your site.
name = "pbs"
adapter = "pbs"
owner = "${USER}"

[scheduler]
kind = "pbs"
submit_binary = "qsub"
status_binary = "qstat"
select_binary = "qselect"
cancel_binary = "qdel"
queue = "gpu"
# account = "rsi"   # qsub -A
# project = "rsi"   # qsub -P
# The planned resources the select chunk names (select=1:ncpus=..:mem=..:ngpus=..);
# a queue that hands out whole nodes or fixed shares may take fewer. A job
# without ngpus, or an exclusive one, may get all the node's GPUs: the Engine
# uses the planned number, lowest index first.
chunk_resources = ["ncpus", "mem", "ngpus"]
# Site resources added to the chunk as given:
# chunk_extra = ["host_type=gpu"]
# place=excl
exclusive = false
poll_seconds = 10.0
# Optional per-job limit, HH:MM. Single-node research can resume under the
# same total budget after an early signal drains Judge and closes Work.
# run_walltime_limit = "12:00"

# Image builds can use another queue, account or project, or request a GPU
# where the build queue rejects GPU-less jobs. CPU and memory still come from
# [builder].
# [scheduler.build]
# queue = "cpu"
# chunk_resources = ["ncpus", "mem"]
# gpus = 0
# exclusive = false

[storage]
run_root = "/srv/rsi/harness/runs"
image_cache = "/srv/rsi/harness/images"
logs_root = "/srv/rsi/harness/logs"
hf_home = "/srv/rsi/cache/huggingface"
hf_datasets_cache = "/srv/rsi/cache/datasets"

[builder]
binary = "/usr/bin/podman"
cpu_slots = 32
memory_mb = 131072
walltime = "02:00"
temp_root = "/tmp"
min_tmp_mb = 71680
# Or the Harness's static Podman, installed into a shared directory before
# the first build:
# podman_bundle = "/shared/rsi-harness/podman"
# storage_driver = "vfs"
# host_namespaces = ["network", "uts"]

[apptainer]
mount_policy = "scoped"
binary = "/usr/bin/apptainer"
dns_bind = "/etc/resolv.conf"
work_binds = []
judge_binds = []
workspace_target = "/testbed"
temp_root = "/tmp"
container_python = "/opt/venv/bin/python"
rdma_binds = []

[apptainer.environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[resources]
min_cpu_slots = 8
min_memory_mb = 65536
min_runtime_tmp_mb = 71680
gpus_per_node = 4
walltime_margin_seconds = 900

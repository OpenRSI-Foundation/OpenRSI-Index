# Nagoya University Flow 2.0, Type II subsystem (PBS Pro, aarch64 GB200 nodes,
# compute nodes reach the internet only through the HTTP proxy every job
# sets), packaged as --cluster flow2: one GPU per job in t2-share. A task
# whose Work and Judge each want a GPU shares that GPU in release-all.
# --cluster flow2-node permits up to four GPUs per phase; check the dry-run
# resource plan against the intended Work/Judge topology. Copy it to add data binds,
# WORKDIR and image Python. See docs/cluster-sites.md for setup.
#
# The login nodes are x86-64 and the GPU nodes aarch64: the Engine runs with
# the controller's Python, so start `rsi-harness run --cluster flow2 ...` in a
# controller job on a GPU node, with an aarch64 Harness venv and Agent CLI on
# its PATH. Its walltime must cover the run job's queue waits and the whole
# run, or the run is resumed from a new controller job.
# The job keeps the node's http(s)_proxy, which the Agent's broker uses.
name = "flow2"
adapter = "pbs"
owner = "${USER}"

[scheduler]
kind = "pbs"
# One GPU, 36 CPUs and 216 GiB per job.
queue = "t2-share"
chunk_resources = ["ngpus"]
exclusive = false
poll_seconds = 10.0
capacity = { cpu_slots = 36, memory_mb = 221184, per_gpu = true }

# t2-share jobs hold a GPU; image builds take one too.
[scheduler.build]
queue = "t2-share"
gpus = 1

[storage]
# /data/<user>: Lustre shared by login and compute nodes.
run_root = "/data/${USER}/rsi/runs"
image_cache = "/data/${USER}/rsi/images"
logs_root = "/data/${USER}/rsi/logs"
hf_home = "/data/${USER}/rsi/cache/huggingface"
hf_datasets_cache = "/data/${USER}/rsi/cache/datasets"

[builder]
# The compute nodes have no Podman: the Harness installs its static Podman
# here before the first build.
podman_bundle = "/data/${USER}/rsi/podman"
storage_driver = "vfs"
host_namespaces = ["network", "uts"]
# Flow2 has no subordinate UID/GID ranges. The unprivileged Apptainer
# installation supplies the helpers for ordinary Dockerfile package installs.
rootless_apt_sandbox = true
faked_binary = "/data/${USER}/rsi/apptainer/aarch64/utils/bin/faked-sysv"
fakeroot_library = "/data/${USER}/rsi/apptainer/aarch64/utils/lib/libfakeroot/libfakeroot-sysv.so"
cpu_slots = 32
memory_mb = 131072
walltime = "02:00"
temp_root = "/tmp"
min_tmp_mb = 71680

[apptainer]
mount_policy = "scoped"
# The nodes have only a setuid SingularityCE: install an unprivileged
# Apptainer (its install-unprivileged.sh) here.
binary = "/data/${USER}/rsi/apptainer/bin/apptainer"
dns_bind = "/etc/resolv.conf"
# The task's data, for example:
# judge_binds = [
#   { source = "/data/${USER}/judge-data", target = "/rsi-data/judge", read_only = true },
# ]
work_binds = []
judge_binds = []
# The task image's WORKDIR and Python 3.8 or later.
workspace_target = "/workspace"
temp_root = "/tmp"
container_python = "/usr/bin/python3"
rdma_binds = []

[apptainer.environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[resources]
min_cpu_slots = 8
min_memory_mb = 65536
min_runtime_tmp_mb = 71680
gpus_per_node = 1
all_gpus_override = 1
walltime_margin_seconds = 900

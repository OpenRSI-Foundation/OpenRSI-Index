# Portable example. Copy outside the repository and configure shared storage,
# installed tools, resource group, data binds, and node resources for your site.
name = "pjm"
adapter = "pjm"
owner = "${USER}"

[scheduler]
kind = "pjm"
submit_binary = "pjsub"
status_binary = "pjstat"
cancel_binary = "pjdel"
resource_group = "gpu"
# group = "rsi"   # pjsub -g
# How a job asks for its GPUs (gpu=N, which brings the node's share of cores
# and memory) and, without GPUs, its CPU cores and memory where the resource
# group needs them (vnode-core=N, vnode-mem=<MiB>Mi). An exclusive job asks
# for a whole node (node=1) and gets all its GPUs: the Engine uses the
# planned number, lowest index first.
gpu_resource = "gpu"
# cpu_resource = "vnode-core"
# memory_resource = "vnode-mem"
# Site resources added as given, such as the container job environment:
# resources = ["jobenv=singularity"]
exclusive = false
poll_seconds = 10.0
# Optional per-job limit, HH:MM:
# run_walltime_limit = "12:00"
# Run build and run jobs inside the controller's own PJM job, started
# from a job script on a compute node, instead of submitting them:
# launch = "allocation"

# [scheduler.build]
# resource_group = "cpu"
# gpus = 0
# exclusive = false

[storage]
run_root = "/srv/rsi/harness/runs"
image_cache = "/srv/rsi/harness/images"
logs_root = "/srv/rsi/harness/logs"
hf_home = "/srv/rsi/cache/huggingface"
hf_datasets_cache = "/srv/rsi/cache/datasets"

[builder]
binary = "/usr/bin/podman"
cpu_slots = 32
memory_mb = 131072
walltime = "02:00"
temp_root = "/tmp"
min_tmp_mb = 71680
# podman_bundle = "/shared/rsi-harness/podman"
# storage_driver = "vfs"
# host_namespaces = ["network", "uts"]

[apptainer]
mount_policy = "scoped"
binary = "/usr/bin/apptainer"
dns_bind = "/etc/resolv.conf"
work_binds = []
judge_binds = []
workspace_target = "/testbed"
temp_root = "/tmp"
container_python = "/opt/venv/bin/python"
rdma_binds = []

[apptainer.environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[resources]
min_cpu_slots = 8
min_memory_mb = 65536
min_runtime_tmp_mb = 71680
gpus_per_node = 4
walltime_margin_seconds = 900
# A variable each job sets to its node-local scratch, used in place of the
# temp_roots above:
# node_tmp_variable = "PJM_LOCALTMP"

# Portable example. Copy outside the repository and configure shared storage,
# installed tools, partition/account, data binds, and node resources for your site.
name = "slurm"
adapter = "slurm"
owner = "${USER}"

[scheduler]
kind = "slurm"
submit_binary = "sbatch"
status_binary = "squeue"
accounting_binary = "sacct"
control_binary = "scontrol"
cancel_binary = "scancel"
remote_binary = "srun"
remote_host_flag = "--nodelist"
partition = "gpu"
account = "rsi"
# Optional site policy:
# qos = "normal"
# constraint = "a100"
exclusive = true
poll_seconds = 10.0

[storage]
run_root = "/srv/rsi/harness/runs"
image_cache = "/srv/rsi/harness/images"
logs_root = "/srv/rsi/harness/logs"
hf_home = "/srv/rsi/cache/huggingface"
hf_datasets_cache = "/srv/rsi/cache/datasets"

[builder]
binary = "/usr/bin/podman"
cpu_slots = 64
memory_mb = 524288
# All cluster profiles use HH:MM; the adapter converts it for sbatch.
walltime = "02:00"
temp_root = "/tmp"
min_tmp_mb = 71680
rootless_apt_sandbox = true
faked_binary = "/usr/bin/faked-sysv"
fakeroot_library = "/usr/lib/x86_64-linux-gnu/libfakeroot/libfakeroot-sysv.so"

[apptainer]
mount_policy = "scoped"
binary = "/usr/bin/apptainer"
dns_bind = "/etc/resolv.conf"
extra_binds = []
# Add the task's data mappings, using the same phase-scoped format as Blue Vela.
work_binds = []
judge_binds = []
judge_authority_root = "/srv/rsi/harness/authority"
build_args = ["--fakeroot"]
workspace_target = "/testbed"
temp_root = "/tmp"
container_python = "/opt/venv/bin/python"
rdma_binds = ["/dev/infiniband", "/sys/class/infiniband"]

[apptainer.environment]
RSI_SHARED_DATA_ROOT = "/rsi-data"

[resources]
min_cpu_slots = 8
min_memory_mb = 65536
min_runtime_tmp_mb = 71680
gpus_per_node = 8
walltime_margin_seconds = 900

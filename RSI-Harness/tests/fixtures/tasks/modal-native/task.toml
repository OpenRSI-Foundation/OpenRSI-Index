schema_version = "1.4"

[task]
name = "rsi/modal-native"

[environment]
os = "linux"
workdir = "/workspace"
gpus = 0
cpus = 1
memory_mb = 1024
network_mode = "no-network"

[agent]
timeout_sec = 120
network_mode = "no-network"

[verifier]
timeout_sec = 30
network_mode = "no-network"

[metadata.rsi_harness.verifier]
gpus = 0
clean_image = true

schema_version = "1.4"

[task]
name = "rsi/minimal-bluevela-multinode"

[environment]
os = "linux"
workdir = "/workspace"
gpus = 16
cpus = 8
memory_mb = 65536
storage_mb = 15360
network_mode = "no-network"

[agent]
timeout_sec = 180
network_mode = "public"

[verifier]
timeout_sec = 30
network_mode = "no-network"

[metadata.rsi_harness.verifier]
gpus = 8

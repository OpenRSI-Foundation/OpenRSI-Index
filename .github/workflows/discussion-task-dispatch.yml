name: Dispatch Discussion task command
run-name: "Discussion #${{ github.event.discussion.number }} ${{ github.event.comment.body == '/reset' && 'reset' || 'task' }}:${{ github.event.comment.node_id }}"

on:
  discussion_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      command_dispatched: ${{ steps.task-dispatch.outcome == 'success' }}
      task_dispatched: ${{ steps.task-dispatch.outcome == 'success' && steps.gate.outputs.command == 'task' }}
      trigger_comment_id: ${{ github.event.comment.node_id }}
    steps:
      - name: Checkout public default branch
        id: public-checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate event
        id: gate
        run: python3 checks/discussion_task_dispatch.py "$GITHUB_EVENT_PATH" dispatch-payload.json

      - name: Create dispatch App token
        id: app-token
        if: steps.gate.outputs.candidate == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RSI_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RSI_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: RSI-Skills
          permission-contents: write
          permission-actions: read
          permission-members: read

      - name: Verify current organization Owner
        id: owner-gate
        if: steps.gate.outputs.candidate == 'true' && steps.gate.outputs.is_author != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENTER_LOGIN: ${{ steps.gate.outputs.commenter_login }}
        run: python3 checks/discussion_recovery.py owner

      - name: Build dispatch request
        if: steps.gate.outputs.candidate == 'true' && (steps.gate.outputs.is_author == 'true' || steps.owner-gate.outputs.is_owner == 'true')
        env:
          COMMAND: ${{ steps.gate.outputs.command }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.load(Path("dispatch-payload.json").open(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("trigger_kind") != "comment":
              raise SystemExit("manual dispatch payload had an invalid trigger kind")
          event_types = {
              "task": "discussion_task_command",
              "reset": "discussion_task_reset",
          }
          try:
              event_type = event_types[os.environ["COMMAND"]]
          except KeyError:
              raise SystemExit("invalid Discussion command") from None
          request = {
              "event_type": event_type,
              "client_payload": payload,
          }
          with Path("repository-dispatch.json").open("w", encoding="utf-8") as output:
              json.dump(request, output, sort_keys=True, separators=(",", ":"))
          PY

      # Acknowledge queue entry before the private worker can start building.
      - name: Create acknowledgement App token
        id: ack-token
        if: steps.gate.outputs.candidate == 'true' && (steps.gate.outputs.is_author == 'true' || steps.owner-gate.outputs.is_owner == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RSI_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RSI_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-discussions: write
      - name: Post task queue notice
        if: steps.gate.outputs.candidate == 'true' && (steps.gate.outputs.is_author == 'true' || steps.owner-gate.outputs.is_owner == 'true') && steps.gate.outputs.command == 'task'
        env:
          GH_TOKEN: ${{ steps.ack-token.outputs.token }}
          BOT_LOGIN: ${{ steps.ack-token.outputs.app-slug }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.node_id }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          python3 checks/discussion_recovery.py gh api graphql \
            -f query='mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                comment { id url }
              }
            }' \
            -f discussionId="$DISCUSSION_ID" \
            -f body='⏳ Your task is queued and will start automatically when a runner is available. No action is needed.'
      - name: Dispatch privately
        id: task-dispatch
        if: steps.gate.outputs.candidate == 'true' && (steps.gate.outputs.is_author == 'true' || steps.owner-gate.outputs.is_owner == 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 checks/discussion_recovery.py gh api --method POST /repos/OpenRSI-Foundation/RSI-Skills/dispatches \
            --input repository-dispatch.json

      - name: Acknowledge accepted task command
        if: steps.task-dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.ack-token.outputs.token }}
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
        run: |
          python3 checks/discussion_recovery.py gh api graphql \
            -f query='mutation($id: ID!, $content: ReactionContent!) {
              addReaction(input: { subjectId: $id, content: $content }) {
                reaction { content }
              }
            }' \
            -f id="$COMMENT_NODE_ID" \
            -f content="EYES"

      - name: Mark failed GitHub setup for external classification
        if: failure() && (steps.public-checkout.outcome == 'failure' || steps.app-token.outcome == 'failure' || steps.ack-token.outcome == 'failure')
        run: printf 'RSI_GITHUB_SETUP_FAILURE operation=discussion.setup\n'

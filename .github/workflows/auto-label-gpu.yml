name: Auto-label gpu

# Labels Work/Judge GPU requirements, including signatures; never runs a GPU.
# Removes the label if no
# changed task.toml requests a GPU. Uses `pull_request_target` so the
# GITHUB_TOKEN has write access on fork PRs; we never check out the PR head —
# we only read task.toml contents via the GitHub API, so untrusted code is not
# executed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'rsi-tasks/**/task.toml'

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - name: Detect gpu request and toggle label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: "gpu"
        run: |
          set -euo pipefail

          # List task.toml files changed in this PR.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[].filename' | grep -E '^rsi-tasks/.+/task\.toml$' || true)

          has_gpu=false
          for f in $files; do
            content=$(gh api "repos/$REPO/contents/$f?ref=$HEAD_SHA" \
              --jq '.content' 2>/dev/null | base64 -d || true)
            # Parse TOML rather than matching GPU mentions in comments/descriptions.
            if printf '%s' "$content" | python3 -c '
          import sys, tomllib
          try:
              d = tomllib.loads(sys.stdin.read())
              work = d.get("environment", {}).get("gpus", 0)
              judge = d.get("metadata", {}).get("rsi_harness", {}).get("verifier", {}).get("gpus", 0)
              sys.exit(0 if any(type(v) is int and v > 0 for v in (work, judge)) else 1)
          except ValueError:
              sys.exit(1)
          '; then
              has_gpu=true
              break
            fi
          done

          has_label=$(gh api "repos/$REPO/issues/$PR/labels" \
            --jq "[.[].name] | index(\"$LABEL\") != null")

          # The label is informational, so a missing label or a token that may
          # not create one is reported, never a failed job.
          skip() {
            echo "::notice::Could not $1 the '$LABEL' label; it only describes declared GPU resources and gates nothing."
          }
          ensure_label() {
            gh api "repos/$REPO/labels/$LABEL" --silent 2>/dev/null && return 0
            # Creation can race with another run; re-check rather than fail.
            gh label create "$LABEL" --repo "$REPO" --color 5319e7 \
              --description "Task declares Work or Judge GPUs" >/dev/null 2>&1 \
              || gh api "repos/$REPO/labels/$LABEL" --silent 2>/dev/null
          }

          if [ "$has_gpu" = "true" ] && [ "$has_label" = "false" ]; then
            echo "Adding label: $LABEL"
            if ! { ensure_label && gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"; }; then
              skip add
            fi
          elif [ "$has_gpu" = "false" ] && [ "$has_label" = "true" ]; then
            echo "Removing label: $LABEL (no task.toml in PR requests a GPU)"
            gh pr edit "$PR" --repo "$REPO" --remove-label "$LABEL" || skip remove
          else
            echo "No label change needed (has_gpu=$has_gpu, has_label=$has_label)"
          fi

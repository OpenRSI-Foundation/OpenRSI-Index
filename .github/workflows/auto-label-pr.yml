name: Auto-label PR areas

# Keeps the path-based area labels in checks/auto_label.py in sync on every
# push: a managed label is added while the PR touches its paths and removed once
# it no longer does; other labels are never touched. `pull_request_target` gives
# the token write access on fork PRs, so only the base revision is checked out
# (for the rule module) and changed files are read through the GitHub API; PR
# code is never checked out or executed.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- base revision only; PR files via the API
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to relabel, or 'open' to backfill every open PR"
        required: true
        default: open

concurrency:
  group: auto-label-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref`: pull_request_target checks out the base branch, never the PR.
      - name: Checkout base revision rule module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout: checks
      - name: Sync area labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 -I checks/auto_label.py --repo "$REPO" "$TARGET"

name: Logs repository audit

# Audits the research logs published in the Hugging Face Logs dataset repository
# (named by checks/publish_logs.py) against this repository's tasks: every log
# root must belong to a task, manifests must match, uploads must be raw files.
# It runs when something that can change that result changes here: the checker,
# its policies, the upload tool, the task list (a removed or renamed task leaves
# orphaned logs) or this workflow. Logs uploads themselves are checked by
# checks/publish_logs.py before upload and, for Hub pull requests, by
# `publish_logs.py --check-pr N`.
on:
  push:
    branches: [main]
    paths:
      - checks/check_publication.py
      - checks/publication-*.toml
      - checks/publish_logs.py
      - rsi-tasks/**
      - .github/workflows/hf-logs-publication-checks.yml
  pull_request:
    paths:
      - checks/check_publication.py
      - checks/publication-*.toml
      - checks/publish_logs.py
      - rsi-tasks/**
      - .github/workflows/hf-logs-publication-checks.yml
  workflow_dispatch:
    inputs:
      revision:
        description: Logs repository revision to audit (main, refs/pr/<N> or a 40-character commit id)
        required: true
        default: main
        type: string

permissions:
  contents: read

# A newer push to a PR supersedes its running audit; pushes to main and manual
# runs each get a group of their own.
concurrency:
  group: hf-logs-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    # Enforcement executes only the checker and policies of the trusted
    # revision: the pushed revision on main, the PR's base for a pull request.
    # The evaluated revision supplies only the task list, read as data.
    name: Logs repository audit (CPU only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout evaluated task list
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: index
          # Only trees are read (git ls-tree rsi-tasks); no task files are needed.
          filter: blob:none
          sparse-checkout: checks
          persist-credentials: false
      - name: Checkout trusted checker and policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: checks
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
      - name: Locate the Logs repository
        id: locate
        env:
          REVISION: ${{ inputs.revision || 'main' }}
        run: |
          set -euo pipefail
          checks="$GITHUB_WORKSPACE/trusted/checks"
          for required in check_publication.py publication-policy.toml publication-gitleaks.toml publish_logs.py; do
            if [ ! -f "$checks/$required" ]; then
              echo "::notice::The trusted revision has no checks/$required; it predates Logs repository audits, so there is nothing to enforce."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          repo=$(python3 -I "$checks/publish_logs.py" --print-repo)
          if ! [[ "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::checks/publish_logs.py names an invalid repository id."
            exit 1
          fi
          if ! [[ "$REVISION" =~ ^(main|refs/pr/[0-9]+|[0-9a-f]{40})$ ]]; then
            echo "::error::The revision must be main, refs/pr/<N> or a 40-character commit id."
            exit 1
          fi
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://huggingface.co/api/datasets/$repo" || true)
          case "$code" in
            200) ;;
            401|404)
              # Anonymous requests get 401 for a repository that does not exist.
              echo "::notice::The Logs repository $repo is not published (HTTP $code); nothing to audit."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Could not reach the Hub (HTTP $code); the audit did not run."
              exit 1
              ;;
          esac
          {
            echo "available=true"
            echo "repo=$repo"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch the Logs revision with its LFS content (anonymous)
        id: fetch
        if: steps.locate.outputs.available == 'true'
        env:
          LOGS_REPO: ${{ steps.locate.outputs.repo }}
          REVISION: ${{ steps.locate.outputs.revision }}
        run: |
          set -euo pipefail
          git init -q logs
          cd logs
          # Anonymous public read: no credential helper; LFS content after checkout.
          git config credential.helper ""
          git lfs install --local --skip-smudge >/dev/null
          git remote add origin "https://huggingface.co/datasets/$LOGS_REPO"
          case "$REVISION" in
            main) refspecs=("+refs/heads/main:refs/remotes/origin/main") ;;
            refs/pr/*) refspecs=("+$REVISION:refs/remotes/origin/checked") ;;
            *) refspecs=("+refs/heads/main:refs/remotes/origin/main" "+refs/pr/*:refs/remotes/origin/pr/*") ;;
          esac
          git fetch --no-tags --quiet origin "${refspecs[@]}"
          case "$REVISION" in
            main) sha=$(git rev-parse refs/remotes/origin/main) ;;
            refs/pr/*) sha=$(git rev-parse refs/remotes/origin/checked) ;;
            *)
              if ! git cat-file -e "${REVISION}^{commit}" 2>/dev/null; then
                echo "::error::Commit $REVISION is not on main or a pull request of $LOGS_REPO."
                exit 1
              fi
              sha=$REVISION
              ;;
          esac
          git checkout -q --detach "$sha"
          git lfs pull
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Audit every published log (--full)
        id: audit
        if: steps.locate.outputs.available == 'true'
        env:
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          checks="$GITHUB_WORKSPACE/trusted/checks"
          set +e
          python3 -I "$checks/check_publication.py" \
            --repo "$GITHUB_WORKSPACE/logs" --mount rsi-logs --full \
            --task-repo "$GITHUB_WORKSPACE/index" --task-ref HEAD \
            --policy "$checks/publication-policy.toml" \
            --secret-config "$checks/publication-gitleaks.toml" \
            --gitleaks "$SCANNER_DIR/gitleaks" 2>&1 | tee "$RUNNER_TEMP/logs-audit.txt"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Job summary
        if: always() && steps.locate.outputs.available == 'true'
        env:
          OUTCOME: ${{ steps.audit.outcome }}
          LOGS_REPO: ${{ steps.locate.outputs.repo }}
          REVISION: ${{ steps.locate.outputs.revision }}
          SHA: ${{ steps.fetch.outputs.sha }}
          INDEX_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The checker prints file, rule and line identifiers only.
          python3 -I - "$RUNNER_TEMP/logs-audit.txt" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(errors="replace") if path.is_file() else ""
          text = re.sub(r"^::(warning|error|notice)::", lambda m: m[1].upper() + ": ", text, flags=re.M)
          if len(text) > 60000:
              text = "[earlier output omitted]\n" + text[-60000:]
          fence = "`" * max(3, 1 + max((len(r) for r in re.findall(r"`+", text)), default=0))
          env = os.environ
          print(f"### Logs repository audit: {env['OUTCOME']}\n")
          print(f"- Logs repository: `{env['LOGS_REPO']}` at `{env['REVISION']}` (`{env['SHA'] or 'not fetched'}`)")
          print(f"- Tasks from OpenRSI-Index `{env['INDEX_SHA']}`\n")
          print(f"{fence}text\n{text.rstrip()}\n{fence}")
          PY

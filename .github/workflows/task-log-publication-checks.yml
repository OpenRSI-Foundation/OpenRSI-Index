name: Task and log publication checks

on:
  # Only changes that can affect the result: task content, the checker, its
  # tests and policies, the Harness it compiles tasks with and runs its tests
  # in, and this workflow; plus the Logs upload tool, the Logs audit workflow and
  # the history guard, whose tests run here. Run logs live in the Hugging Face
  # Logs dataset, and the history guard rejects any PR that adds rsi-logs/.
  # Main has no required status checks, so a path-filtered check never leaves a
  # merge waiting on it.
  pull_request:
    paths:
      - rsi-tasks/**
      - checks/check_publication.py
      - checks/test_publication.py
      - checks/publication-*.toml
      - RSI-Harness/pyproject.toml
      - RSI-Harness/uv.lock
      - RSI-Harness/src/**
      - .github/workflows/task-log-publication-checks.yml
      - .github/workflows/hf-logs-publication-checks.yml
      - .github/workflows/history-guard.yml
      - checks/publish_logs.py
      - checks/test_publish_logs.py
  push:
    branches: [main]
    paths:
      - rsi-tasks/**
      - checks/check_publication.py
      - checks/test_publication.py
      - checks/publication-*.toml
      - RSI-Harness/pyproject.toml
      - RSI-Harness/uv.lock
      - RSI-Harness/src/**
      - .github/workflows/task-log-publication-checks.yml
      - .github/workflows/hf-logs-publication-checks.yml
      - .github/workflows/history-guard.yml
      - checks/publish_logs.py
      - checks/test_publish_logs.py
  # A manual run audits every published package (--full), not an empty diff.
  workflow_dispatch:

permissions:
  contents: read

# Only a superseded PR run is cancelled. Each push to main audits its own diff
# from the previous push, and a manual run audits everything, so those get a
# group of their own and are never cancelled or dropped while queued.
concurrency:
  group: task-log-publication-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checker-tests:
    # Runs the proposed checker's own tests. They are PR-controlled code, so
    # they get their own job and runner and cannot touch enforcement files.
    name: Publication checker tests (proposed revision)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout proposed checker
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.6.5"
          enable-cache: false
      - name: Install checksum-pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
      - name: Install Harness compiler dependencies (no task dependencies)
        working-directory: RSI-Harness
        run: uv sync --frozen --no-dev --python 3.12
      - name: Test publication checker without Docker, GPUs or models
        working-directory: RSI-Harness
        env:
          PUBLICATION_GITLEAKS_BIN: ${{ runner.temp }}/publication-gitleaks/gitleaks
          # Scanner and compiler integration tests must run here, not skip.
          PUBLICATION_REQUIRE_INTEGRATION: "1"
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -I ../checks/test_publication.py
          uv run --frozen --no-dev python -I ../checks/test_publish_logs.py

  publication:
    # Enforcement executes only the base revision's checker, policies and
    # Harness; the proposed revision is read as data and never run.
    name: Task and log publication (CPU only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout submitted publication data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proposal
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout base Harness and trusted publication policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          persist-credentials: false
          sparse-checkout: |
            RSI-Harness
            checks
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.6.5"
          enable-cache: false
      - name: Install base-revision compiler dependencies (no task dependencies)
        working-directory: trusted-base/RSI-Harness
        run: uv sync --frozen --no-dev --python 3.12
      - name: Install checksum-pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
      - name: Validate changed task and log packages
        working-directory: trusted-base/RSI-Harness
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCED: ${{ github.event.forced || false }}
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          PUBLICATION_CHECKS="$GITHUB_WORKSPACE/trusted-base/checks"
          # Never fall back to the proposed checker or policy: that would let a
          # PR decide its own result. A base without them cannot enforce.
          for required in check_publication.py publication-policy.toml publication-gitleaks.toml; do
            if [ ! -f "$PUBLICATION_CHECKS/$required" ]; then
              echo "::error::The PR base lacks checks/$required; rebase onto a base that has the publication checker."
              exit 1
            fi
          done
          mode=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode=(--full)
            BASE_REF="$HEAD_REF"
          elif [ "$FORCED" = "true" ] \
            || ! git -C "$GITHUB_WORKSPACE/proposal" cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            # A force push (for example after a history rewrite) or a base this
            # checkout lacks leaves no diff to audit, so audit the whole head.
            echo "::notice::No usable base revision for an incremental check; auditing every published package (--full)."
            mode=(--full)
            BASE_REF="$HEAD_REF"
          fi
          uv run --frozen --no-dev python -I "$PUBLICATION_CHECKS/check_publication.py" \
            --repo "$GITHUB_WORKSPACE/proposal" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --compile "${mode[@]}" \
            --policy "$PUBLICATION_CHECKS/publication-policy.toml" \
            --secret-config "$PUBLICATION_CHECKS/publication-gitleaks.toml" \
            --gitleaks "$SCANNER_DIR/gitleaks"

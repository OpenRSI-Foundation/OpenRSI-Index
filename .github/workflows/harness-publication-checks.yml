name: Harness publication checks

# Checks a Harness change: the publisher archive, lint and CPU tests, and
# every published task compiled with the proposed Harness. Task and checker
# changes are checked by task-log-publication-checks.yml, with the base Harness,
# so only Harness changes (dependencies are locked) run this. It also runs once
# on main after each such change is merged.
on:
  pull_request:
    paths:
      - RSI-Harness/**
      - .github/workflows/harness-publication-checks.yml
      - checks/test_harness_publication_workflow.py
  push:
    branches: [main]
    paths:
      - RSI-Harness/**
      - .github/workflows/harness-publication-checks.yml
      - checks/test_harness_publication_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication-compatibility:
    name: Harness publication compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive Harness exactly as the task publisher does
        id: archive
        run: |
          set -euo pipefail
          archive_root=$(mktemp -d "$RUNNER_TEMP/rsi-publication-check.XXXXXX")
          git archive HEAD RSI-Harness | tar -x -C "$archive_root"
          for required in pyproject.toml uv.lock logs/runs/.gitkeep src/rsi_harness/task/compiler.py; do
            if [ ! -f "$archive_root/RSI-Harness/$required" ]; then
              printf '::error::Harness publication requires %s\n' "$required"
              exit 1
            fi
          done
          printf 'root=%s\n' "$archive_root" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.6.5"
          enable-cache: false
      - name: Install the publisher compiler environment
        working-directory: ${{ steps.archive.outputs.root }}/RSI-Harness
        run: uv sync --frozen --no-dev --python 3.12
      - name: Compile CPU and GPU tasks without running them
        working-directory: ${{ steps.archive.outputs.root }}/RSI-Harness
        run: |
          uv run --frozen --no-dev python - <<'PY'
          import shutil
          import tempfile
          from pathlib import Path
          from rsi_harness.models import CompileOptions
          from rsi_harness.task.compiler import HarborTaskCompiler

          fixture = Path("tests/fixtures/tasks/minimal-gpu").resolve()
          for gpu_count in (0, 1):
              with tempfile.TemporaryDirectory() as temporary:
                  task = Path(temporary) / fixture.name
                  shutil.copytree(fixture, task)
                  config = task / "task.toml"
                  config.write_text(config.read_text().replace("gpus = 1", f"gpus = {gpu_count}"))
                  definition = HarborTaskCompiler().compile(
                      task,
                      CompileOptions(primary_reward="reward", score_direction="maximize", max_submissions=None),
                  )
                  assert definition.task_id == task.name
                  assert str(definition.workdir) == "/workspace"
                  assert definition.gpu_requirement.count == gpu_count
                  print(f"Publisher compilation passed: Work GPUs={gpu_count}, Judge GPUs={definition.verifier.gpu_count}")
          PY
      - name: Lint Harness
        working-directory: ${{ steps.archive.outputs.root }}/RSI-Harness
        run: |
          uv sync --frozen --group test --python 3.12
          uv run --frozen --group test ruff check .
          uv run --frozen --group test ruff format --check .
      - name: Set up the node the Agent driver runs on
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
      - name: Test Harness without Docker or GPUs
        working-directory: ${{ steps.archive.outputs.root }}/RSI-Harness
        run: |
          uv sync --frozen --group test --python 3.12
          uv run --frozen --group test python -m pytest -m 'not integration and not gpu' -q

  published-tasks:
    # The task publication workflow compiles only changed tasks, with the base
    # Harness; this compiles every published task with the proposed one.
    name: Published tasks with this Harness (CPU only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.6.5"
          enable-cache: false
      - name: Install Harness compiler dependencies (no task dependencies)
        working-directory: RSI-Harness
        run: uv sync --frozen --no-dev --python 3.12
      - name: Compile every published task without running it
        working-directory: RSI-Harness
        run: |
          set -euo pipefail
          # Task checks and CPU compilation only: no image builds. Task content
          # is unchanged here, so its secret scan stays with the task workflow.
          uv run --frozen --no-dev python -I ../checks/check_publication.py \
            --repo "$GITHUB_WORKSPACE" --full --compile
      - name: Install checksum-pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/publication-gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks
      - name: Test publication checker without Docker, GPUs or models
        working-directory: RSI-Harness
        env:
          PUBLICATION_GITLEAKS_BIN: ${{ runner.temp }}/publication-gitleaks/gitleaks
          # Scanner and compiler integration tests must run here, not skip.
          PUBLICATION_REQUIRE_INTEGRATION: "1"
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -I ../checks/test_publication.py
          uv run --frozen --no-dev python -I ../checks/test_publish_logs.py

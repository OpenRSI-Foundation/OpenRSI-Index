name: Discussion automation checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discussion-*.yml
      - .github/workflows/harness-publication-checks.yml
      - .github/workflows/harness-agent-tests.yml
      - .github/workflows/harness-root-checks.yml
      - .github/workflows/task-log-publication-checks.yml
      - .github/workflows/auto-label-*.yml
      - checks/**
      - .agents/skills/proposal-agent/scripts/**
  pull_request:
    paths:
      - .github/workflows/discussion-*.yml
      - .github/workflows/harness-publication-checks.yml
      - .github/workflows/harness-agent-tests.yml
      - .github/workflows/harness-root-checks.yml
      - .github/workflows/task-log-publication-checks.yml
      - .github/workflows/auto-label-*.yml
      - checks/**
      - .agents/skills/proposal-agent/scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal-session-python39:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Test contributor helper on macOS system Python version
        run: uv run --python 3.9 --with pytest python -m pytest -q checks/test_proposal_session.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Test Discussion review and dispatch
        run: |
          uv run --python 3.12 --with pytest --with pyyaml --with openai --with httpx \
            python -m pytest -q checks/test_*.py

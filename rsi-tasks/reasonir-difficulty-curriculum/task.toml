schema_version = "1.4"

[task]
name = "rsi/reasonir-difficulty-curriculum"
version = "1.1.0"
description = "Research difficulty-conditioned curricula for fixed-budget ReasonIR retrieval post-training."

[metadata]
author_name = "Rulin Shao"
author_email = "contributor-13@example.invalid"
difficulty_explanation = "Each scoreable candidate requires a fixed 1,000-update four-GPU LoRA run and a complete evaluation of three fixed BRIGHT subjects plus four BEIR datasets; useful conclusions require matched policy trials."
verification_explanation = "A four-GPU Judge validates the adapter, fixed-budget provenance and workspace scope, then recomputes the three-subject reasoning proxy and four-dataset general retrieval scores from complete task-owned corpora. This is not a full-BRIGHT score."
category = "ML"
subcategory = "Training"
tags = ["autoresearch", "retrieval", "curriculum", "lora", "reasonir"]
expert_time_estimate_hours = 14.0
relevant_experience = "Contributor works on research-agent evaluation and model-development research."

[metadata.rsi_harness.verifier]
gpus = 4

[environment]
os = "linux"
cpus = 64
memory_mb = 524288
storage_mb = 153600
build_timeout_sec = 7200
workdir = "/workspace"
gpus = 4
network_mode = "no-network"

[agent]
timeout_sec = 90000
network_mode = "no-network"

[verifier]
timeout_sec = 4500
network_mode = "no-network"
environment_mode = "shared"

[verifier.env]
REASONIR_BASELINE_R0 = "${REASONIR_BASELINE_R0}"
REASONIR_BASELINE_G0 = "${REASONIR_BASELINE_G0}"

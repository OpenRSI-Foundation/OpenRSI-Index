schema_version = "1.4"

[task]
name = "rsi/isaaclab-peginsert-reward-search"
version = "1.0.0"
description = "Search bounded reward graphs for fixed-budget Isaac Lab PegInsert PPO training."

[metadata]
author_name = "Kaiyuan Zheng"
author_email = "contributor-11@example.invalid"
difficulty_explanation = "Each candidate requires long-horizon GPU PPO training, contact-rich simulation, and hypothesis-driven reward design under a fixed transition budget."
verification_explanation = "Judge validates up to two declarative reward graphs, trains one fresh fixed single-GPU PPO run per graph in parallel on its two GPUs, measures each retained policy on 1,024 private-reset episodes, and scores the best; candidate code and checkpoints are never scoring inputs."
category = "ML"
subcategory = "Training"
tags = ["autoresearch", "reinforcement-learning", "robotics", "reward-design", "isaac-lab"]
